<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>ToolPool - Login / Sign Up</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header>

        <h1>
            <a href="mainindex.html">ToolPool</a>
        </h1>

        <nav>
            <a href="listings.html">Listings</a>
            <a href="login.html">Login / Sign Up</a>
        </nav>

    </header>


    <main>

        <section class="signup-container">

            <h2>Login / Sign Up</h2>

            <p>
                Sign in to rent out your tools on ToolPool.
            </p>


            <form onsubmit="loginUser(event)">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="login">
                Don't have an account?
            </p>


            <button onclick="signUpUser()">
                Sign Up
            </button>

        </section>

    </main>


    <footer>

        <p>
            ToolPool &copy; 2026
        </p>

    </footer>


    <script>

        function loginUser(event) {

            event.preventDefault();

            // fake a successful login
            localStorage.setItem("loggedIn", "true");

            // Send user to the post listing page
            window.location.href = "post-tool.html";

        }


        function signUpUser() {

            // fake account creation
            localStorage.setItem("loggedIn", "true");

            // Send user to the post listing page
            window.location.href = "post-tool.html";

        }

    </script>

</body>

</html>
