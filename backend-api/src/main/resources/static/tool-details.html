<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Details - Tool Pool</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 14px; cursor: pointer; }
    .message { padding: 10px; border-radius: 6px; margin: 10px 0; display: none; }
    .error { background: #fde2e2; color: #a00; display: block; }
    .success { background: #e2f5e2; color: #060; display: block; }
    .hidden { display: none; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.85em; }
    .listed { background: #e2f5e2; }
    .unlisted { background: #eee; }
  </style>
</head>
<body>
  <p><a href="listings.html">&larr; Back to listings</a></p>
  <div id="pageMessage" class="message"></div>

  <!-- Tool + owner details (loaded from API) -->
  <div id="toolCard" class="card hidden">
    <h1 id="toolName"></h1>
    <span id="toolStatus" class="badge"></span>
    <p id="toolDescription"></p>
    <p><strong>Price per day:</strong> $<span id="toolPrice"></span></p>
    <p><strong>Location:</strong> <span id="toolLocation"></span></p>
    <p><strong>Owner:</strong> <span id="ownerName"></span></p>
  </div>

  <!-- User story 2: booking form (renters) -->
  <div id="bookingCard" class="card hidden">
    <h2>Book this tool</h2>
    <form id="bookingForm">
      <label for="startDate">Start date</label>
      <input type="date" id="startDate" required>
      <label for="endDate">End date</label>
      <input type="date" id="endDate" required>
      <button type="submit">Book now</button>
    </form>
    <div id="bookingMessage" class="message"></div>
  </div>

  <!-- User story 3: owner view (edit + unlist) -->
  <div id="ownerCard" class="card hidden">
    <h2>Manage your listing</h2>
    <form id="editForm">
      <label for="editName">Name</label>
      <input type="text" id="editName" required>
      <label for="editDescription">Description</label>
      <textarea id="editDescription" rows="3"></textarea>
      <label for="editPrice">Price per day</label>
      <input type="number" id="editPrice" min="0" step="0.01" required>
      <label for="editLocation">Location</label>
      <input type="text" id="editLocation">
      <button type="submit">Save changes</button>
    </form>
    <button id="unlistBtn" type="button">Unlist this tool</button>
    <div id="ownerMessage" class="message"></div>
  </div>

  <script src="tool-details.js"></script>
</body>


</html>
