<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>ToolPool - Login / Sign Up</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header>

        <h1>
            <a href="index.html">ToolPool</a>
        </h1>

        <nav>
            <a href="listings.html">Listings</a>
            <a href="admin.html">Admin</a>
            <a href="login.html" id="auth-link">Login / Sign Up</a>
        </nav>

    </header>


    <main>

        <section class="signup-container">

            <h2>Login / Sign Up</h2>

            <p>
                Sign in to rent out your tools on ToolPool.
            </p>

            <!-- Errors and success messages from js/login.js -->
            <p id="login-message" class="message" hidden></p>

            <form id="login-form" novalidate>

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <button type="submit" id="login-button">
                    Login
                </button>

            </form>


            <p class="login">
                Don't have an account?
            </p>


            <button type="button" onclick="window.location.href='signup.html'">
                Sign Up
            </button>

        </section>

    </main>


    <footer>

        <p>
           2026 ToolPool
        </p>

    </footer>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
